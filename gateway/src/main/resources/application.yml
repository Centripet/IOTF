server:
  port: 48585

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: test-service-route
              uri: lb://test-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1
  config:
    import: nacos:localhost:8848